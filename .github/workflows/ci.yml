# P0-2 CI 质量门禁：push/PR 到 main 触发。
# - quality 作业：tsc（前端+server 双 tsconfig）+ eslint + vitest 全量单测
# - eval-gate 作业：评测集结构门禁（规模/六类覆盖/字段合法性，mock-free 不连 DB/LLM）；
#   真实 LLM 准确率评测放本地/nightly（npm run eval -- --min-accuracy 85），
#   prompt 相关文件变更时输出全量评测提醒。
# - e2e 作业（P1-4）：Playwright smoke 探针集（健康检查/JSON 契约/知识库链路），
#   MySQL 以 service container 提供；不需 LLM。全量 E2E 仍在本地跑（npm run test:e2e）。
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    name: 质量门禁（tsc + eslint + vitest）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: TypeScript 类型检查（前端主 tsconfig）
        run: npm run lint
      - name: TypeScript 类型检查（server strict）
        run: npm run lint:server
      - name: TypeScript 增量 strict 检查（前端 strictNullChecks，P1-10）
        run: npm run lint:strict
      - name: ESLint
        run: npm run lint:js
      - name: OpenAPI 同步校验（代码路由与 docs/openapi.json 一致性）
        run: npm run docs:check
      - name: 进程内状态巡检（P2-3，白名单外新增模块级可变存储拦截）
        run: npm run state:check
      - name: Vitest 单测全量
        run: npm test

  eval-gate:
    name: 评测集门禁（结构 + 阈值契约）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 评测集结构校验（≥100 条 + 六类分层 + permission 权限类覆盖）
        run: npx tsx server/eval/checkEvalSet.ts --min-count 100 --require single_agg,join,time,subquery,clarify,refuse,permission
      - name: 宽表评测集结构校验（≥50 条 + multi_dim 六类分层，P3-2）
        run: npx tsx server/eval/checkEvalSet.ts --file server/eval/evalCases.jichuang.json --min-count 50 --require single_agg,multi_dim,subquery,time,clarify,refuse
      - name: prompt 变更触发全量评测提醒
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          # event 字段经 env 传入（防 shell 注入）；before 为 GitHub 生成的 commit SHA，校验为十六进制后再用
          BASE="${EVENT_BEFORE:-HEAD~1}"
          if ! echo "${BASE}" | grep -qE '^[0-9a-f]{40}$'; then BASE="HEAD~1"; fi
          CHANGED="$(git diff --name-only "${BASE}" HEAD 2>/dev/null || git show --name-only --format= HEAD)"
          if echo "${CHANGED}" | grep -qE 'server/(liveQuery|liveReport|llmClient|schemaLinking|schemaContext)\.ts|server/eval/'; then
            echo "::warning::检测到 prompt/评测相关文件变更，请本地执行全量评测：npm run eval -- --min-accuracy 85"
          fi

  e2e:
    name: 端到端冒烟（Playwright smoke 探针集）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-e2e-pass
          MYSQL_DATABASE: smart_analytics
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -u root -pci-e2e-pass"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12
    env:
      MYSQL_HOST: 127.0.0.1
      MYSQL_PORT: '3306'
      MYSQL_USER: root
      MYSQL_PASSWORD: ci-e2e-pass
      MYSQL_DATABASE: smart_analytics
      JWT_SECRET: ci-e2e-only-jwt-secret
      ADMIN_USERNAME: admin
      ADMIN_PASSWORD: admin123
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: 安装 Playwright Chromium（含系统依赖）
        run: npx playwright install --with-deps chromium
      - name: 运行 smoke E2E（webServer 自动拉起 server.ts 并等待 /api/health/ready）
        run: npx playwright test tests/e2e/smoke.spec.ts
      - name: 失败时上传测试产物（截图 / trace）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
