<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- 国产双核浏览器（360 极速/安全浏览器、QQ 浏览器等）内核选择：
         renderer=webkit 强制走 Chromium 极速内核，X-UA-Compatible 阻止回落到 IE 兼容内核。
         缺此声明时双核浏览器可能按域名历史记录落入 IE 内核，React 应用会直接白屏。 -->
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="renderer" content="webkit" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>智能问数分析系统</title>
    <!-- PWA：可安装性（manifest + 图标 + 主题色）；Chrome 桌面在安全上下文（HTTPS/localhost）下提供「安装应用」 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon-180.png" />
    <meta name="theme-color" content="#0f172a" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 渲染前应用已保存的 UI 主题，避免浅色/深色切换闪烁
      try {
        if (localStorage.getItem('app-ui-theme') === 'light') {
          document.documentElement.classList.add('light');
          // PWA：同步窗口标题栏主题色（与 uiTheme.applyUITheme 保持一致）
          document.querySelector('meta[name="theme-color"]')?.setAttribute('content', '#f8fafc');
        }
      } catch (e) {}
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
