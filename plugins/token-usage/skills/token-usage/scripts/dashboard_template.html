<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qoder Token 消费仪表盘</title>
<style>
  :root{
    --bg:#0a0e16; --card:#101725; --card2:#0c1220; --border:#1d2738;
    --text:#e8edf5; --muted:#7e8aa0; --muted2:#5b6577;
    --accent:#7c5cff; --accent2:#4c8dff;
    --cached:#4c8dff; --uncached:#a371f7; --output:#f59e0b; --cost:#34d399;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{
    background:radial-gradient(1100px 500px at 18% -8%, rgba(124,92,255,.10), transparent 60%),
               radial-gradient(900px 420px at 85% -6%, rgba(76,141,255,.08), transparent 60%),
               var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .page{max-width:1280px;margin:0 auto;padding:26px 22px 46px}

  /* header */
  .hd{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
  .hd-left{display:flex;align-items:center;gap:14px}
  .logo{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;
    background:linear-gradient(135deg,#7c5cff,#4c8dff);box-shadow:0 6px 18px rgba(124,92,255,.35);flex:none}
  .logo svg{display:block}
  h1{font-size:19px;margin:0;letter-spacing:.01em}
  .sub{font-size:12px;color:var(--muted);margin-top:3px}
  .sub b{color:#a8b3c7;font-weight:600}

  /* tabs */
  .tabs{display:flex;gap:4px;background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:4px}
  .tabs button{border:0;background:transparent;color:var(--muted);font-size:12.5px;padding:6px 14px;border-radius:9px;
    cursor:pointer;font-family:inherit;transition:color .15s}
  .tabs button:hover{color:#c6d0e2}
  .tabs button.on{background:linear-gradient(135deg,rgba(124,92,255,.95),rgba(76,141,255,.95));color:#fff;
    font-weight:600;box-shadow:0 2px 10px rgba(124,92,255,.35)}
  .tabs.sm button{padding:5px 11px;font-size:12px}

  /* KPI */
  .kpis{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin:20px 0 16px}
  .kpi{background:linear-gradient(180deg,rgba(124,92,255,.075),transparent 58%),var(--card);
    border:1px solid var(--border);border-radius:15px;padding:14px 16px;min-width:0}
  .kpi .k-label{font-size:11px;color:var(--muted);letter-spacing:.05em}
  .kpi .k-val{font-size:23px;font-weight:700;margin-top:7px;font-variant-numeric:tabular-nums;letter-spacing:-.01em;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi .k-sub{font-size:11px;color:var(--muted2);margin-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .kpi.hl .k-val{background:linear-gradient(135deg,#a78bfa,#60a5fa);-webkit-background-clip:text;background-clip:text;color:transparent}

  /* grid & cards */
  .grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px;margin-bottom:14px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 18px;min-width:0}
  .col-4{grid-column:span 4}.col-6{grid-column:span 6}.col-8{grid-column:span 8}
  .card-hd{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
  .card-hd h2{font-size:13.5px;margin:0;font-weight:600;color:#d7deea}
  .hint{font-size:11px;color:var(--muted2)}
  .legend{display:flex;gap:14px;margin:2px 0 6px;flex-wrap:wrap}
  .legend .lg{display:flex;align-items:center;gap:6px;font-size:11.5px;color:var(--muted)}
  .legend .sw{width:10px;height:10px;border-radius:3px;flex:none}

  /* charts */
  #chartTokens svg,#chartCost svg{display:block}
  #chartCost svg{max-height:340px}

  /* bars */
  .bar-row{display:grid;grid-template-columns:148px 1fr auto;align-items:center;gap:10px;padding:4.5px 0}
  .bar-label{font-size:12px;color:#c9d2e2;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .bar-track{height:15px;background:var(--card2);border:1px solid rgba(29,39,56,.7);border-radius:6px;overflow:hidden}
  .bar-fill{height:100%;border-radius:5px}
  .bar-val{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
  .empty{color:var(--muted2);font-size:12px;padding:26px 0;text-align:center}

  /* table */
  .table-wrap{overflow:auto;max-height:460px;border:1px solid rgba(29,39,56,.7);border-radius:12px}
  table{width:100%;border-collapse:collapse;font-size:12px}
  thead th{position:sticky;top:0;z-index:1;text-align:right;color:var(--muted);font-weight:500;font-size:10.5px;
    letter-spacing:.06em;text-transform:uppercase;padding:9px 12px;background:#0d1424;border-bottom:1px solid var(--border)}
  thead th:first-child{text-align:left}
  tbody td{text-align:right;padding:8px 12px;border-bottom:1px solid rgba(29,39,56,.55);
    font-variant-numeric:tabular-nums;color:#c4cede;white-space:nowrap}
  tbody td:first-child{text-align:left;color:#e8edf5;max-width:340px;overflow:hidden;text-overflow:ellipsis}
  tbody tr:hover td{background:rgba(124,92,255,.06)}
  tbody tr:last-child td{border-bottom:0}
  .pos{color:#a78bfa}
  .fee{color:#4ade80}

  /* footer */
  .foot{margin-top:18px;padding:14px 16px;border:1px dashed var(--border);border-radius:12px;
    font-size:11.5px;color:var(--muted2);line-height:1.9}
  .foot b{color:var(--muted)}

  @media (max-width:1080px){
    .kpis{grid-template-columns:repeat(3,1fr)}
    .col-8,.col-6,.col-4{grid-column:1/-1}
  }
  @media (max-width:640px){
    .kpis{grid-template-columns:repeat(2,1fr)}
    .bar-row{grid-template-columns:110px 1fr auto}
  }
</style>
</head>
<body>
<div class="page">
  <header class="hd">
    <div class="hd-left">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <rect x="3" y="13" width="4" height="8" rx="1.4" fill="#fff" opacity=".7"/>
          <rect x="10" y="8" width="4" height="13" rx="1.4" fill="#fff" opacity=".88"/>
          <rect x="17" y="3" width="4" height="18" rx="1.4" fill="#fff"/>
        </svg>
      </div>
      <div>
        <h1>Qoder Token 消费仪表盘</h1>
        <div class="sub">官方模型 + 自定义模型（BYOK） ｜ 数据快照：<b id="genAt">—</b> ｜ 时区：北京时间（UTC+8）</div>
      </div>
    </div>
    <nav class="tabs" id="rangeTabs"></nav>
  </header>

  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="card col-8">
      <div class="card-hd"><h2>每日 Token 用量</h2><span class="hint">悬停柱体查看当日明细</span></div>
      <div class="legend">
        <span class="lg"><span class="sw" style="background:var(--cached)"></span>缓存命中</span>
        <span class="lg"><span class="sw" style="background:var(--uncached)"></span>未命中输入</span>
        <span class="lg"><span class="sw" style="background:var(--output)"></span>输出</span>
      </div>
      <div id="chartTokens"></div>
    </div>
    <div class="card col-4">
      <div class="card-hd"><h2>每日参考费用</h2><span class="hint">单位：元</span></div>
      <div id="chartCost"></div>
    </div>
    <div class="card col-6">
      <div class="card-hd"><h2>模型分布</h2><span class="hint">按 Token 量</span></div>
      <div id="chartModels"></div>
    </div>
    <div class="card col-6">
      <div class="card-hd"><h2>项目排行 Top 12</h2><span class="hint">按 Token 量</span></div>
      <div id="chartProjects"></div>
    </div>
  </section>

  <section class="card">
    <div class="card-hd">
      <h2>消费明细</h2>
      <nav class="tabs sm" id="dimTabs"></nav>
    </div>
    <div class="table-wrap">
      <table>
        <thead id="tHead"></thead>
        <tbody id="tBody"></tbody>
      </table>
    </div>
  </section>

  <footer class="foot" id="foot"></footer>
</div>

<script>
const DATA = __DATA__;
const NS = 'http://www.w3.org/2000/svg';
const $ = id => document.getElementById(id);
const DIM_NAMES = { day: '日期', model: '模型', project: '项目' };
const state = { range: (DATA.ranges[0] || {}).id || '7', dim: 'day' };

/* ---------- 格式化 ---------- */
function fmt(n) { return (n || 0).toLocaleString('en-US'); }
function compact(n) {
  n = n || 0;
  if (n >= 1e8) return (n / 1e8).toFixed(2).replace(/\.?0+$/, '') + ' 亿';
  if (n >= 1e4) return (n / 1e4).toFixed(1).replace(/\.0$/, '') + ' 万';
  return String(Math.round(n));
}
function money(c) {
  if (c == null) return '—';
  const s = Number(c).toFixed(2), p = s.split('.');
  return '¥' + p[0].replace(/\B(?=(\d{3})+(?!\d))/g, ',') + '.' + p[1];
}
function pct(x) { return ((x || 0) * 100).toFixed(1) + '%'; }
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

/* ---------- SVG 工具 ---------- */
function svgEl(tag, attrs, txt) {
  const e = document.createElementNS(NS, tag);
  for (const k in attrs) e.setAttribute(k, attrs[k]);
  if (txt != null) e.textContent = txt;
  return e;
}
function asc(rows) { return rows.slice().sort((a, b) => (a.key < b.key ? -1 : 1)); }

/* ---------- 渲染：KPI ---------- */
function renderKpis(rng) {
  const s = rng.summary;
  const kpis = [
    { label: '总 TOKENS', val: compact(s.total), sub: '精确值 ' + fmt(s.total), hl: true },
    { label: '参考费用', val: money(s.cost), sub: '仅计入已配置单价的模型' },
    { label: '消息数', val: fmt(s.msgs), sub: '输入 ' + compact(s.prompt) + ' ｜ 输出 ' + compact(s.completion) },
    { label: '缓存命中率', val: pct(s.cacheRate), sub: '缓存命中 ' + compact(s.cached) + ' tokens' },
    { label: '自定义模型占比', val: pct(s.customShare), sub: compact(s.customTotal) + ' tokens ｜ 按 DeepSeek-Flash 计价' }
  ];
  $('kpis').innerHTML = kpis.map(k =>
    '<div class="kpi' + (k.hl ? ' hl' : '') + '"><div class="k-label">' + k.label +
    '</div><div class="k-val">' + k.val + '</div><div class="k-sub">' + k.sub + '</div></div>'
  ).join('');
}

/* ---------- 渲染：每日 Token 堆叠柱 ---------- */
function renderTokens(dayRows) {
  const host = $('chartTokens'); host.textContent = '';
  const rows = asc(dayRows).filter(r => r.total > 0);
  if (!rows.length) { host.innerHTML = '<div class="empty">该范围内暂无数据</div>'; return; }
  const W = 980, H = 280, padL = 62, padR = 14, padT = 14, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max.apply(null, rows.map(r => r.total)) || 1;
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%' });
  svg.style.height = 'auto';
  for (let i = 0; i <= 4; i++) {
    const y = padT + ih - ih * i / 4;
    svg.appendChild(svgEl('line', {
      x1: padL, x2: W - padR, y1: y, y2: y, stroke: '#1d2738', 'stroke-width': 1,
      'stroke-dasharray': i ? '3 5' : 'none'
    }));
    svg.appendChild(svgEl('text', {
      x: padL - 10, y: y + 3.5, 'text-anchor': 'end', 'font-size': 10.5, fill: '#5b6577'
    }, compact(max * i / 4)));
  }
  const n = rows.length, step = iw / n, bw = Math.min(26, Math.max(3, step * 0.62));
  const lblEvery = Math.ceil(n / 10);
  rows.forEach((r, i) => {
    const cx = padL + step * i + step / 2, x = cx - bw / 2;
    const segs = [
      [r.cached, 'var(--cached)', '缓存命中'],
      [Math.max(r.prompt - r.cached, 0), 'var(--uncached)', '未命中输入'],
      [r.completion, 'var(--output)', '输出']
    ];
    let yb = padT + ih;
    segs.forEach(function (s) {
      const v = s[0]; if (v <= 0) return;
      const h = ih * v / max; yb -= h;
      const rect = svgEl('rect', { x: x, y: yb, width: bw, height: Math.max(h, 0.8), fill: s[1], rx: Math.min(2.5, bw / 4) });
      rect.appendChild(svgEl('title', {}, r.key + ' · ' + s[2] + '：' + fmt(v) + ' tokens'));
      svg.appendChild(rect);
    });
    if (i % lblEvery === 0 || i === n - 1) {
      svg.appendChild(svgEl('text', { x: cx, y: H - 9, 'text-anchor': 'middle', 'font-size': 10, fill: '#5b6577' }, r.key.slice(5)));
    }
  });
  host.appendChild(svg);
}

/* ---------- 渲染：每日费用折线 ---------- */
function renderCost(dayRows) {
  const host = $('chartCost'); host.textContent = '';
  const rows = asc(dayRows).filter(r => r.cost != null && r.cost > 0);
  if (!rows.length) { host.innerHTML = '<div class="empty">该范围内暂无可计价数据</div>'; return; }
  const W = 440, H = 280, padL = 52, padR = 14, padT = 14, padB = 30;
  const iw = W - padL - padR, ih = H - padT - padB;
  const max = Math.max.apply(null, rows.map(r => r.cost)) || 1;
  const n = rows.length;
  const X = i => padL + (n === 1 ? iw / 2 : iw * i / (n - 1));
  const Y = v => padT + ih - ih * v / max;
  const svg = svgEl('svg', { viewBox: '0 0 ' + W + ' ' + H, width: '100%' });
  svg.style.height = 'auto';
  const defs = svgEl('defs', {});
  const lg = svgEl('linearGradient', { id: 'costGrad', x1: 0, y1: 0, x2: 0, y2: 1 });
  lg.appendChild(svgEl('stop', { offset: '0', 'stop-color': '#34d399', 'stop-opacity': .32 }));
  lg.appendChild(svgEl('stop', { offset: '1', 'stop-color': '#34d399', 'stop-opacity': 0 }));
  defs.appendChild(lg); svg.appendChild(defs);
  for (let i = 0; i <= 4; i++) {
    const y = padT + ih - ih * i / 4, v = max * i / 4;
    svg.appendChild(svgEl('line', {
      x1: padL, x2: W - padR, y1: y, y2: y, stroke: '#1d2738', 'stroke-width': 1,
      'stroke-dasharray': i ? '3 5' : 'none'
    }));
    svg.appendChild(svgEl('text', {
      x: padL - 8, y: y + 3.5, 'text-anchor': 'end', 'font-size': 10.5, fill: '#5b6577'
    }, v >= 100 ? '¥' + v.toFixed(0) : '¥' + v.toFixed(v >= 10 ? 1 : 2)));
  }
  const line = rows.map((r, i) => (i ? 'L' : 'M') + X(i).toFixed(1) + ',' + Y(r.cost).toFixed(1)).join('');
  svg.appendChild(svgEl('path', {
    d: line + 'L' + X(n - 1).toFixed(1) + ',' + (padT + ih).toFixed(1) + 'L' + X(0).toFixed(1) + ',' + (padT + ih).toFixed(1) + 'Z',
    fill: 'url(#costGrad)'
  }));
  svg.appendChild(svgEl('path', { d: line, fill: 'none', stroke: '#34d399', 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
  const dotEvery = Math.ceil(n / 45), lblEvery = Math.ceil(n / 7);
  rows.forEach((r, i) => {
    if (i % dotEvery === 0 || i === n - 1) {
      const c = svgEl('circle', { cx: X(i), cy: Y(r.cost), r: 2.6, fill: '#0a0e16', stroke: '#34d399', 'stroke-width': 1.8 });
      c.appendChild(svgEl('title', {}, r.key + '：' + money(r.cost)));
      svg.appendChild(c);
    }
    if (i % lblEvery === 0 || i === n - 1) {
      svg.appendChild(svgEl('text', { x: X(i), y: H - 9, 'text-anchor': 'middle', 'font-size': 10, fill: '#5b6577' }, r.key.slice(5)));
    }
  });
  host.appendChild(svg);
}

/* ---------- 渲染：横向条形（模型 / 项目） ---------- */
function renderBars(hostId, rows, limit, colorFn) {
  const host = $(hostId); host.textContent = '';
  const list = rows.slice(0, limit);
  if (!list.length) { host.innerHTML = '<div class="empty">该范围内暂无数据</div>'; return; }
  const max = Math.max.apply(null, list.map(r => r.total)) || 1;
  const totalAll = rows.reduce((s, r) => s + r.total, 0) || 1;
  list.forEach(r => {
    const row = document.createElement('div'); row.className = 'bar-row';
    const label = document.createElement('div'); label.className = 'bar-label';
    label.title = r.label; label.textContent = r.label;
    const track = document.createElement('div'); track.className = 'bar-track';
    const fill = document.createElement('div'); fill.className = 'bar-fill';
    fill.style.width = Math.max(r.total / max * 100, 0.6) + '%';
    fill.style.background = colorFn(r);
    track.appendChild(fill);
    const val = document.createElement('div'); val.className = 'bar-val';
    val.innerHTML = compact(r.total) + ' · ' + pct(r.total / totalAll) +
      (r.cost != null ? ' · <span class="fee">' + money(r.cost) + '</span>' : '');
    row.append(label, track, val); host.appendChild(row);
  });
}
const modelColor = r =>
  r.key === 'custom_model' ? 'linear-gradient(90deg,#7c5cff,#a371f7)' :
  r.key === '(未记录)' ? '#4b5568' : 'linear-gradient(90deg,#2563eb,#4c8dff)';
const projectColor = () => 'linear-gradient(90deg,#4c8dff,#22d3ee)';

/* ---------- 渲染：明细表 ---------- */
function renderTable() {
  const rng = curRng(), rows = rng[state.dim] || [];
  const totalAll = rows.reduce((s, r) => s + r.total, 0) || 1;
  $('tHead').innerHTML = '<tr><th>' + DIM_NAMES[state.dim] + '</th><th>消息数</th><th>输入 Tokens</th>' +
    '<th>输出 Tokens</th><th>缓存 Tokens</th><th>合计 Tokens</th><th>占比</th><th>参考费用</th></tr>';
  $('tBody').innerHTML = rows.map(r => '<tr>' +
    '<td title="' + esc(r.label) + '">' + esc(r.label) + '</td>' +
    '<td>' + fmt(r.msgs) + '</td><td>' + fmt(r.prompt) + '</td><td>' + fmt(r.completion) + '</td>' +
    '<td>' + fmt(r.cached) + '</td><td>' + fmt(r.total) + '</td>' +
    '<td class="pos">' + pct(r.total / totalAll) + '</td><td class="fee">' + money(r.cost) + '</td></tr>'
  ).join('');
}

/* ---------- 状态与总渲染 ---------- */
function curRng() { return DATA.ranges.find(r => r.id === state.range) || DATA.ranges[0]; }
function renderTabs() {
  $('rangeTabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.id === state.range));
  $('dimTabs').querySelectorAll('button').forEach(b => b.classList.toggle('on', b.dataset.d === state.dim));
}
function renderAll() {
  const rng = curRng();
  renderKpis(rng);
  renderTokens(rng.day || []);
  renderCost(rng.day || []);
  renderBars('chartModels', rng.model || [], 30, modelColor);
  renderBars('chartProjects', rng.project || [], 12, projectColor);
  renderTable();
  renderTabs();
}
function init() {
  $('genAt').textContent = DATA.generatedAt;
  $('foot').innerHTML = '<b>口径说明</b><br>' + DATA.footnotes.map(f => '· ' + esc(f)).join('<br>');
  $('rangeTabs').innerHTML = DATA.ranges.map(r =>
    '<button data-id="' + r.id + '">' + esc(r.label) + '</button>').join('');
  $('rangeTabs').querySelectorAll('button').forEach(b => b.onclick = () => { state.range = b.dataset.id; renderAll(); });
  $('dimTabs').innerHTML = ['day', 'model', 'project'].map(d =>
    '<button data-d="' + d + '">按' + DIM_NAMES[d] + '</button>').join('');
  $('dimTabs').querySelectorAll('button').forEach(b => b.onclick = () => { state.dim = b.dataset.d; renderTable(); renderTabs(); });
  renderAll();
}
init();
</script>
</body>
</html>
