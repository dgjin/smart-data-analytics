# P2-13 多实例负载均衡示例（Nginx 轮询）。
# 要点：SSE 流式问数（/api/query/natural-language, stream=true）为长连接，
# 必须关闭代理缓冲并放大读超时；应用本身无状态，无需 ip_hash 粘性。
upstream smart_analytics_app {
    server app1:3000 max_fails=3 fail_timeout=15s;
    server app2:3000 max_fails=3 fail_timeout=15s;
}

server {
    listen 80;

    # 问数 SSE 单连接内闭环（请求即流），天然粘性；仅需保证长连接不被代理截断
    location /api/ {
        proxy_pass http://smart_analytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # SSE：关闭响应缓冲，读超时覆盖最长问数链路（含深度分析）
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location / {
        proxy_pass http://smart_analytics_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
