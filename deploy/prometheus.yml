# Prometheus 抓取配置——智能问数据分析系统
# 应用 /metrics 暴露：问数状态计数、端到端耗时、缓存命中、LLM 时延/token、SQL 执行耗时、HTTP 接口耗时
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# P1：告警规则加载 + Alertmanager 通知
rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  # 应用主链路（多实例部署时在此追加 app2 地址，instance label 自动区分）
  - job_name: nl2sql-app
    metrics_path: /metrics
    static_configs:
      - targets: ['host.docker.internal:3000']
        labels:
          service: 'nl2sql'

  # 宿主机资源（CPU/内存/磁盘）
  - job_name: node
    static_configs:
      - targets: ['node-exporter:9100']

  # 查询缓存层
  - job_name: redis
    static_configs:
      - targets: ['redis-exporter:9121']

  # 系统元数据库 + 业务库
  - job_name: mysql
    static_configs:
      - targets: ['mysql-exporter:9104']

  # Alertmanager 自监控（P2：up{job="alertmanager"} 支撑 AlertmanagerDown 告警）
  - job_name: alertmanager
    static_configs:
      - targets: ['alertmanager:9093']

# 说明：Ollama 原生不暴露 Prometheus 格式指标（根路径返回纯文本，抓取会解析失败），
# P0 不单独采集——Ollama 健康度通过应用侧 llm_call_duration_seconds{ok="0"} 异常率观测。

# P2 多实例抓取拓扑（与 docker-compose.multi-instance.yml 联动）：
# 多实例部署时 app1/app2 已映射宿主端口 3001/3002，改用下方 job 替换 nl2sql-app 单实例 job——
# 每实例进程内计数器独立（instance label 区分），仪表盘 sum() 聚合口径不变：
#   - job_name: nl2sql-app
#     metrics_path: /metrics
#     static_configs:
#       - targets: ['host.docker.internal:3001', 'host.docker.internal:3002']
#         labels:
#           service: 'nl2sql'
