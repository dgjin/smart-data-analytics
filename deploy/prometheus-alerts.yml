# Prometheus 告警规则——智能问数据分析系统（P1）
# 基线依据（2026-09 性能专项评估）：SUCCESS avg 249s、缓存命中率 3.5%→P0 优化后目标 >30%、FALLBACK 率 7.9%
# 注意：比率类规则在无流量时结果为 NaN（PromQL 中 NaN < x 为 false），天然不误报；
#       缓存命中率额外加流量门槛，避免夜间低流量误报。
groups:
  - name: nl2sql-availability
    rules:
      # 应用进程宕机 / /metrics 抓取失败
      - alert: Nl2sqlAppDown
        expr: up{job="nl2sql-app"} == 0
        for: 1m
        labels: { severity: critical, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "问数应用实例不可达"
          description: "实例 {{ $labels.instance }} 已连续 1 分钟无法抓取 /metrics，服务可能已宕机。"

      # MySQL 元数据库宕机
      - alert: MySQLDown
        expr: up{job="mysql"} == 0
        for: 1m
        labels: { severity: critical, service: mysql, aiops_demo: "true" }
        annotations:
          summary: "MySQL exporter 不可达或 MySQL 宕机"
          description: "mysql-exporter 已连续 1 分钟抓取失败，系统元数据库可能不可用（登录/审计/缓存索引均受影响）。"

      # Redis 缓存层宕机（应用层有内存回退，降级运行非致命）
      - alert: RedisDown
        expr: up{job="redis"} == 0
        for: 2m
        labels: { severity: warning, service: redis, aiops_demo: "true" }
        annotations:
          summary: "Redis 缓存层不可达"
          description: "redis-exporter 已连续 2 分钟抓取失败；应用将回退进程内缓存（多实例语义缓存/限流共享状态失效）。"

      # Redis 自动落盘停摆（v0.9.116，2026-10-22 复盘：save 规则被 CONFIG SET save "" 清空时
      # 不写任何日志，只能靠落盘年龄 + 未落盘写入数发现）。阈值 7200s 与 REDIS_RDB_STALE_MINUTES 默认值一致，
      # 调整环境变量时须同步本规则。
      - alert: RedisRdbSaveStale
        expr: redis_rdb_last_save_age_seconds > 7200 and redis_rdb_changes_since_last_save > 0
        for: 10m
        labels: { severity: warning, service: redis, aiops_demo: "true" }
        annotations:
          summary: "Redis 自动落盘停摆（超过 2 小时未保存且存在未落盘写入）"
          description: "实例 {{ $labels.instance }} 已 {{ $value | humanizeDuration }} 未落盘且仍有写入，检查 CONFIG GET save 是否被清空、rdb_last_bgsave_status 是否 err（对照 /api/health/persistence）。"

      - alert: RedisRdbSaveFailures
        expr: redis_rdb_saves_consecutive_failures > 0
        for: 5m
        labels: { severity: critical, service: redis, aiops_demo: "true" }
        annotations:
          summary: "Redis BGSAVE 连续失败"
          description: "实例 {{ $labels.instance }} 连续 {{ $value }} 次 BGSAVE 失败（磁盘/fork/权限），写入可能被 stop-writes-on-bgsave-error 拒绝。"

      - alert: RedisAofDisabled
        expr: redis_aof_enabled == 0
        for: 30m
        labels: { severity: warning, service: redis, aiops_demo: "true" }
        annotations:
          summary: "Redis AOF 未开启（重启最多丢失一个 RDB 周期数据）"
          description: "实例 {{ $labels.instance }} 的 appendonly 为 no，检查 /opt/homebrew/etc/redis.conf 与运行期 CONFIG GET appendonly 是否被回退。"

      - alert: RedisAofWriteFailed
        expr: redis_aof_last_write_status_ok == 0
        for: 5m
        labels: { severity: critical, service: redis, aiops_demo: "true" }
        annotations:
          summary: "Redis AOF 写盘失败（写命令将被拒绝）"
          description: "实例 {{ $labels.instance }} 的 aof_last_write_status 为 err，检查磁盘容量/权限，恢复前所有写命令返回 MISCONF。"

  - name: nl2sql-business
    rules:
      # 问数成功率骤降（基线：SUCCESS+CACHE 占比；排除拒答/澄清等正常业务终态之外的 ERROR/FALLBACK 侵蚀）
      - alert: QuerySuccessRateLow
        expr: |
          sum(rate(nl2sql_requests_total{status=~"SUCCESS|CACHE"}[5m]))
            / sum(rate(nl2sql_requests_total{endpoint="query"}[5m])) < 0.85
        for: 5m
        labels: { severity: critical, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "问数成功率低于 85%"
          description: "近 5 分钟成功率 {{ $value | humanizePercentage }}，请检查 LLM 引擎与数据源可用性。"

      # 端到端 P95 时延恶化（基线 SUCCESS avg 249s；P0 优化后双表放宽预期显著下降，超 180s 持续即告警）
      - alert: QueryLatencyP95High
        expr: |
          histogram_quantile(0.95,
            sum(rate(nl2sql_duration_seconds_bucket{status=~"SUCCESS|FALLBACK"}[10m])) by (le)) > 180
        for: 10m
        labels: { severity: warning, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "问数端到端 P95 时延超过 180s"
          description: "近 10 分钟 P95 = {{ $value }}s，检查 LLM 模型负载（llm_call_duration）与 SQL 执行耗时（sql_execute_duration）占比定位瓶颈。"

      # 缓存命中率异常（P0 优化后目标 >30%；低于 15% 且有流量时提示失效联动/TTL 配置可能异常）
      - alert: CacheHitRateLow
        expr: |
          (
            sum(rate(nl2sql_cache_hits_total[1h]))
              / sum(rate(nl2sql_requests_total{endpoint="query"}[1h])) < 0.15
          )
          and sum(rate(nl2sql_requests_total{endpoint="query"}[1h])) > 0.005
        for: 1h
        labels: { severity: warning, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "查询缓存命中率低于 15%（有流量前提下）"
          description: "近 1 小时命中率 {{ $value | humanizePercentage }}；检查数据源变更后失效联动（invalidateQueryCache）与 QUERY_CACHE_TTL_MINUTES 配置。"

      # FALLBACK 降级率超标（基线 7.9%）
      - alert: FallbackRateHigh
        expr: |
          sum(rate(nl2sql_requests_total{status="FALLBACK"}[30m]))
            / sum(rate(nl2sql_requests_total{endpoint="query"}[30m])) > 0.15
        for: 30m
        labels: { severity: warning, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "问数 FALLBACK 降级率超过 15%"
          description: "近 30 分钟降级率 {{ $value | humanizePercentage }}（基线 7.9%），多为 SQL 生成/执行反复失败，检查 LLM 输出质量与数据源 schema 同步状态。"

  - name: nl2sql-resources
    rules:
      # Node 进程内存（LLM prompt 组装与结果集驻留，基线运行约数百 MB）
      - alert: AppMemoryHigh
        expr: process_resident_memory_bytes{job="nl2sql-app"} > 1.5 * 1024 * 1024 * 1024
        for: 15m
        labels: { severity: warning, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "应用进程常驻内存超过 1.5GiB"
          description: "实例 {{ $labels.instance }} 内存 {{ $value | humanize1024 }}B 持续 15 分钟，疑似泄漏（关注 embedding 缓存/审计缓冲）。"

      # 宿主机/容器磁盘（node-exporter 根文件系统；macOS Docker 下观测的是 Linux VM 磁盘，作趋势参考）
      - alert: DiskSpaceLow
        expr: |
          1 - (node_filesystem_avail_bytes{mountpoint=~"/|/host", fstype!~"tmpfs|overlay|devfs|map.*"}
                 / node_filesystem_size_bytes{mountpoint=~"/|/host", fstype!~"tmpfs|overlay|devfs|map.*"}) > 0.85
        for: 10m
        labels: { severity: warning, service: infra, aiops_demo: "true" }
        annotations:
          summary: "磁盘使用率超过 85%"
          description: "挂载点 {{ $labels.mountpoint }} 可用空间不足 15%，关注 Prometheus 时序库与 MySQL 数据增长。"

  # v0.9.93：自动运维事件流（ops_events 表归集的 CRITICAL/ERROR 事件出现即提示；
  # 明细与 ACK/RESOLVED 处置闭环见 GET /api/ops/events；WARN 级（如漂移）不触发本告警）
  - name: nl2sql-ops-events
    rules:
      - alert: OpsEventHighSeverity
        expr: increase(ops_events_recorded_total{severity=~"CRITICAL|ERROR"}[10m]) > 0
        for: 0m
        labels: { severity: warning, service: nl2sql, aiops_demo: "true" }
        annotations:
          summary: "近 10 分钟出现高严重度运维事件（CRITICAL/ERROR）"
          description: "新增 {{ $value | humanize }} 条（severity={{ $labels.severity }}, category={{ $labels.category }}）；拉取 /api/ops/events?status=NEW 查看并处置。"

  # P2：监控栈自监控（Prometheus/Alertmanager 自身的健康）
  - name: monitoring-self
    rules:
      # Prometheus 时间序列基数（本项目量级约数百条；异常膨胀提示 label 基数失控或抓取目标异常）
      - alert: PrometheusCardinalityHigh
        expr: prometheus_tsdb_head_series > 400000
        for: 15m
        labels: { severity: warning, service: monitoring }
        annotations:
          summary: "Prometheus 活跃序列数超过 40 万"
          description: "当前 {{ $value }} 条活跃序列，检查是否有高基数 label 被引入（question/userId 等红线字段）。"

      # 告警规则求值失败（规则写错/PromQL 不合法时第一时间发现）
      - alert: PrometheusRuleEvalFailures
        expr: increase(prometheus_rule_evaluation_failures_total[15m]) > 0
        for: 0m
        labels: { severity: warning, service: monitoring }
        annotations:
          summary: "Prometheus 告警规则求值失败"
          description: "近 15 分钟规则求值失败 {{ $value }} 次，检查 prometheus-alerts.yml 语法与函数拼写。"

      # 目标抓取耗时过长（应用 /metrics 响应变慢 = 进程卡顿先兆）
      - alert: ScrapeDurationSlow
        expr: prometheus_target_scrape_duration_seconds > 10
        for: 10m
        labels: { severity: warning, service: monitoring }
        annotations:
          summary: "{{ $labels.job }} 抓取耗时超过 10s"
          description: "抓取 {{ $labels.instance }} 耗时 {{ $value }}s 持续 10 分钟，目标进程可能过载。"

      # Alertmanager 宕机（告警静默——有告警也发不出）
      - alert: AlertmanagerDown
        expr: up{job="alertmanager"} == 0
        for: 2m
        labels: { severity: critical, service: monitoring }
        annotations:
          summary: "Alertmanager 不可达"
          description: "告警通知通道中断，Prometheus 侧告警仍在评估但无法触达通知渠道。"
