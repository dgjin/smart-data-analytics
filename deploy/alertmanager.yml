# Alertmanager 配置——智能问数据分析系统
# 通知渠道：Webhook（企业微信/钉钉/自研网关均可接入）。
# 本文件为模板：__ALERT_WEBHOOK_URL__ 占位符由 deploy/alertmanager-entrypoint.sh 在容器启动时
# 替换为 ALERT_WEBHOOK_URL 环境变量值（alertmanager 无原生 env 展开能力）：
#   - 未设置：默认指向 http://127.0.0.1:9/blackhole（弃包端口，等价静默黑洞，告警仍可在 Prometheus/Alertmanager UI 查看）
#   - 企业微信群机器人：https://qyapi.weixin.qq.com/cgi-bin/webhook/send?key=xxxx（需自研小网关做格式转换）
#   - 邮件渠道：参考下方注释模板，填入 SMTP 参数后把 default-receiver 改为 email
global:
  resolve_timeout: 5m
  # smtp_smarthost: 'smtp.example.com:465'
  # smtp_from: 'alert@example.com'
  # smtp_auth_username: 'alert@example.com'
  # smtp_auth_password: 'xxxx'
  # smtp_require_tls: true

route:
  receiver: webhook
  group_by: ['alertname', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # 【BEGIN-OPS-AGENT】（v0.9.94）自动运维智能体旁路：业务告警复制推送至 OPS_AGENT_WEBHOOK_URL
    # （智能体侧承接端；与其拉取的 /api/ops/events 双通道互备——推送用于实时感知，拉取用于兜底恢复）。
    # continue: true —— 告警继续流向下方主通道（webhook），旁路仅复制不替代；
    # aiops_demo != "true" 排除演示告警，避免污染本系统智能体。
    # 未配置 OPS_AGENT_WEBHOOK_URL 时由 entrypoint.sh 删除本段与 receivers 中的同标记段。
    - matchers: ['severity =~ "critical|warning"', 'aiops_demo != "true"']
      receiver: ops-agent
      continue: true
    # 【END-OPS-AGENT】

    # 【AIOps Agent 接入点】带 aiops_demo="true" 标签的告警转发至本地自动修复智能体（WP1 感知层）。
    # 置于 critical 子路由之前以保证优先匹配；continue: true —— 复制而非替代：
    # 告警在进 AIOps 自动修复的同时继续流向下方主通道（webhook），保留常规通知路径
    # （2026-10 接入 prometheus-alerts 业务规则时由「拦截」调整为「复制」）。
    # repeat_interval: 5m —— 机制说明（2026-10-04 实测）：Alertmanager 对「内容未变化」的告警组
    # 仅在 repeat_interval 到期后才重发，且同一 labelset「恢复后再次故障」不被视为内容变化
    # （startsAt 刷新不计入内容哈希）；间隔过长（原 1h）会把二次故障延迟到下一周期才被感知。
    # 5m 重发由 AIOps 侧幂等层吸收：alert_id = fingerprint+startsAt（同周期重复投递 → duplicates
    # 去重；新周期 startsAt 刷新 → 正常发起新 workflow），resolved 不发送（send_resolved: false）。
    # 接入服务：AIOps Agent 工作区 aiops-agent/alert_webhook.py（默认端口 8099）。
    - matchers: ['aiops_demo = "true"']
      receiver: aiops-agent
      group_wait: 5s
      repeat_interval: 5m
      continue: true

    # critical 告警更频繁提醒
    - matchers: ['severity = critical']
      repeat_interval: 1h

    # 兜底主通道（v0.9.94）：显式保留 webhook 接收——上面旁路带 continue 时 Alertmanager 语义为
    # 「任一 continue 子路由命中后父 receiver 不再自动接收」，非 critical 告警同样须送达主通道。
    - matchers: ['alertname =~ ".+"']

receivers:
  - name: webhook
    webhook_configs:
      - url: '__ALERT_WEBHOOK_URL__'
        send_resolved: true

  # 【BEGIN-OPS-AGENT】（v0.9.94）自动运维智能体推送通道（地址由 entrypoint.sh 渲染）；
  # 未配置 OPS_AGENT_WEBHOOK_URL 时随 routes 中的同标记段一并删除
  - name: ops-agent
    webhook_configs:
      - url: '__OPS_AGENT_WEBHOOK_URL__'
        send_resolved: false
  # 【END-OPS-AGENT】

  # 【AIOps Agent 接入点】本地告警接入服务（aiops-agent/alert_webhook.py，默认 8099）
  - name: aiops-agent
    webhook_configs:
      - url: 'http://host.docker.internal:8099/webhook'
        send_resolved: false

  # - name: email
  #   email_configs:
  #     - to: 'ops@example.com'
  #       send_resolved: true

inhibit_rules:
  # 应用宕机时抑制其下游业务告警（成功率/时延必然连锁异常，避免告警风暴）
  - source_match: { alertname: 'Nl2sqlAppDown' }
    target_match_re: { alertname: 'QuerySuccessRateLow|QueryLatencyP95High|CacheHitRateLow|FallbackRateHigh' }
    equal: ['service']
