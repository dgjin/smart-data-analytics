# Prometheus + Grafana 监控栈（P0）
# 用法：
#   docker compose -f docker-compose.monitoring.yml up -d
#   Prometheus: http://localhost:9090    Grafana: http://localhost:3100（admin / ${GRAFANA_ADMIN_PASSWORD:-admin}）
# 说明：
# - 本栈只编排监控组件；应用/MySQL/Redis/Ollama 使用既有实例，容器内经 host.docker.internal 回宿主机；
# - 应用侧需先启动（npm run dev / node dist/server.cjs），/metrics 端点方可抓取；
# - 项目名内嵌（name:），规避中文目录名导致 compose 项目名解析为空的问题；
# - mysql-exporter 凭据经 .my.cnf 挂载注入（v0.16+ 已移除 DATA_SOURCE_NAME 支持）：
#   默认读取 ${MYSQL_EXPORTER_CNF:-$HOME/.config/nl2sql-monitoring/my.cnf}，格式 [client] user/password/host/port，
#   密码不落库；cnf 若为本机 600 权限，容器内需以属主 uid 运行（HOST_UID 覆盖，默认 macOS 首用户 501）；
# - redis-exporter 用独立变量 REDIS_EXPORTER_ADDR（不消费应用侧 REDIS_URL——localhost 在容器内指向容器自身）。
name: nl2sql-monitoring
services:
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.retention.time=30d'
      - '--storage.tsdb.retention.size=2GB'
    ports:
      - '9090:9090'
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/prometheus-alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      - alertmanager
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:v0.28.1
    # alertmanager 无原生环境变量展开能力（v0.27~v0.34 实测均无 --config.expand-env），
    # 经 entrypoint 脚本在启动时将模板中的 __ALERT_WEBHOOK_URL__ 渲染为环境变量值
    entrypoint: /bin/sh
    command: ['/etc/alertmanager/entrypoint.sh']
    environment:
      # 通知 Webhook 地址：企业微信/钉钉网关或自研接收端；未设置时指向弃包端口（静默黑洞，仅 UI 可见）
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-http://127.0.0.1:9/blackhole}
    ports:
      - '9093:9093'
    volumes:
      - ./deploy/alertmanager.yml:/etc/alertmanager/alertmanager.tpl.yml:ro
      - ./deploy/alertmanager-entrypoint.sh:/etc/alertmanager/entrypoint.sh:ro
      - alertmanager-data:/alertmanager
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.2.2
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: 'false'
    ports:
      - '3100:3000'
    volumes:
      - grafana-data:/var/lib/grafana
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.8.2
    pid: host
    ports:
      - '9100:9100'
    volumes:
      - /:/host:ro,rslave
    command:
      - '--path.rootfs=/host'
    restart: unless-stopped

  redis-exporter:
    image: oliver006/redis_exporter:v1.63.0
    environment:
      # 独立变量：应用侧 REDIS_URL=redis://localhost:6379 在容器内会指向容器自身，不可复用
      REDIS_ADDR: ${REDIS_EXPORTER_ADDR:-redis://host.docker.internal:6379}
    ports:
      - '9121:9121'
    restart: unless-stopped

  mysql-exporter:
    image: prom/mysqld-exporter:v0.17.2
    # v0.16+ 移除 DATA_SOURCE_NAME 环境变量支持，凭据经 .my.cnf 挂载注入（密码含特殊字符亦安全）；
    # cnf 建议 600 权限，故容器以属主 uid 运行（HOST_UID 覆盖）
    user: "${HOST_UID:-501}"
    command:
      - '--config.my-cnf=/.my.cnf'
    volumes:
      - ${MYSQL_EXPORTER_CNF:-~/.config/nl2sql-monitoring/my.cnf}:/.my.cnf:ro
    ports:
      - '9104:9104'
    restart: unless-stopped

volumes:
  prometheus-data:
  grafana-data:
  alertmanager-data:
